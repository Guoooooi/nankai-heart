<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ff4f92' d='M16 29S3 20.6 3 12.2C3 7.6 6.4 5 9.9 5c2.4 0 4.7 1.3 6.1 3.4C17.4 6.3 19.7 5 22.1 5 25.6 5 29 7.6 29 12.2 29 20.6 16 29 16 29z'/%3E%3C/svg%3E">
<style>
  :root{
    --pink:#ff5f9e;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    position:fixed;inset:0;
    background:#06010b;
    color:#fff;
    font-family:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }

  /* ---------- 背景氛围 ---------- */
  .aurora{
    position:fixed;inset:-15%;
    pointer-events:none;
    transform-origin:var(--ax,50%) var(--ay,31%);
    will-change:transform;
    background:
      radial-gradient(36% 30% at var(--ax,50%) var(--ay,31%), rgba(255,70,140,.32), rgba(255,70,140,0) 72%),
      radial-gradient(34% 30% at 16% 84%, rgba(150,80,255,.20), rgba(150,80,255,0) 72%),
      radial-gradient(26% 24% at 86% 12%, rgba(255,140,190,.15), rgba(255,140,190,0) 72%),
      radial-gradient(60% 50% at 50% 50%, rgba(60,10,60,.35), rgba(0,0,0,0) 75%);
  }
  #fx{
    position:fixed;inset:0;
    display:block;
    pointer-events:none;
    z-index:2;
  }
  .vignette{
    position:fixed;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 100%);
  }
  .grain{
    position:fixed;inset:0;z-index:4;pointer-events:none;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }
  .flash{
    position:fixed;inset:0;z-index:6;pointer-events:none;opacity:0;
    background:radial-gradient(50% 40% at var(--ax,50%) var(--ay,31%), rgba(255,225,238,.8), rgba(255,120,170,0) 70%);
  }

  /* ---------- 文字 ---------- */
  .content{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:0 clamp(20px,6vw,40px) calc(7.5vh + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;text-align:center;
    pointer-events:none;
  }
  .tag{
    display:inline-flex;align-items:center;gap:10px;
    font-size:10.5px;letter-spacing:.34em;color:rgba(255,214,232,.5);
    text-indent:.34em;
  }
  .tag::before,.tag::after{content:"";width:26px;height:1px;background:linear-gradient(90deg,rgba(255,95,158,0),rgba(255,95,158,.75));}
  .tag::after{background:linear-gradient(90deg,rgba(255,95,158,.75),rgba(255,95,158,0));}

  h1{
    margin-top:clamp(10px,2.2vh,20px);
    font-size:clamp(29px,7.6vw,54px);
    font-weight:600;line-height:1.24;letter-spacing:.03em;
    text-shadow:0 2px 30px rgba(255,60,130,.28);
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(96deg,#ffe6f0 0%,#ff86b8 34%,#ff3f88 62%,#ffd6e7 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,70,140,.6));
  }
  .sign{
    margin-top:clamp(8px,1.8vh,18px);
    font-size:clamp(12.5px,3.4vw,16px);
    letter-spacing:.16em;color:rgba(255,255,255,.55);
  }
  .sign b{font-weight:500;color:#fff;letter-spacing:.22em;}
  .poem{
    margin-top:clamp(14px,3vh,28px);
    max-width:20em;
    font-size:clamp(12.5px,3.35vw,15.5px);
    line-height:1.95;letter-spacing:.08em;
    color:rgba(255,226,238,.8);
    min-height:3.9em;
    text-shadow:0 1px 16px rgba(0,0,0,.6);
  }
  .poem span{
    display:inline-block;
    transition:opacity .38s ease, filter .38s ease, transform .38s var(--ease);
  }
  .hint{
    margin-top:clamp(14px,2.6vh,26px);
    display:inline-flex;align-items:center;gap:9px;
    font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.44);
    text-indent:.2em;
    transition:color .5s ease;
    min-height:1.2em;
  }
  .hint::before{
    content:"";width:5px;height:5px;border-radius:50%;
    background:var(--pink);
    box-shadow:0 0 12px 2px rgba(255,95,158,.85);
    animation:dot 2.2s ease-in-out infinite;
    flex:none;
  }
  .hint.hot{color:rgba(255,190,215,.92);}
  @keyframes dot{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.9);opacity:1}}
  .foot{
    margin-top:clamp(16px,3vh,30px);
    font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.2);
    text-indent:.22em;
  }

  /* ---------- 入场 ---------- */
  .reveal{
    opacity:0;transform:translateY(18px);filter:blur(9px);
    transition:opacity 1.1s ease, transform 1.2s var(--ease), filter 1.1s ease;
  }
  .reveal.in{opacity:1;transform:translateY(0);filter:blur(0);}

  /* ---------- 宽屏（横屏 / 电脑） ---------- */
  body.wide .content{
    left:50%;right:auto;width:min(44vw,540px);
    top:50%;bottom:auto;transform:translateY(-50%);
    padding:0;
    align-items:flex-start;text-align:left;
  }
  body.wide h1{font-size:clamp(34px,3.7vw,58px);}
  body.wide .sign{font-size:18px;}
  body.wide .poem{max-width:22em;font-size:16.5px;line-height:2.05;min-height:3.7em;}
  body.wide .hint{font-size:12px;}
  body.wide .foot{font-size:11px;align-self:flex-start;}
  body.wide .tag::before,
  body.wide .tag::after{width:48px;}

  @media (prefers-reduced-motion: reduce){
    .reveal{transition-duration:.3s;}
    .hint::before{animation:none;}
  }
</style>

<body>

<div class="aurora" id="aurora"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>
<div class="grain"></div>
<div class="flash" id="flash"></div>

<main class="content">
  <p class="tag reveal"><span>南 开 · 1 9 1 9</span></p>
  <h1 class="reveal">你好呀，<em>南开人</em></h1>
  <p class="sign reveal">我是 <b>郭宇瑞</b></p>
  <p class="poem reveal"><span id="poemText">有些心意，不必说出口，心跳会替我说。</span></p>
  <p class="hint reveal" id="hint">轻触换一句 · 按住加速 · 拖动揉一揉</p>
  <p class="foot reveal">♥ 郭宇瑞 · 为你跳动</p>
</main>

<script>
(function () {
  'use strict';

  /* ================= 工具 ================= */
  var TAU = Math.PI * 2;
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var rand = function (a, b) { return a + Math.random() * (b - a); };
  var gauss = function () { return (Math.random() + Math.random() + Math.random() - 1.5) * 2; };
  var easeOutCubic = function (t) { return 1 - Math.pow(1 - t, 3); };
  var easeOutQuint = function (t) { return 1 - Math.pow(1 - t, 5); };
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d', { alpha: true });
  var auroraEl = document.getElementById('aurora');
  var flashEl = document.getElementById('flash');
  var poemText = document.getElementById('poemText');
  var hintEl = document.getElementById('hint');

  /* ================= 贴图 ================= */
  function makeSprite(rgb, size) {
    var S = size || 64;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    var r = S / 2;
    var grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, 'rgba(255,255,255,.98)');
    grd.addColorStop(0.22, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',.85)');
    grd.addColorStop(0.5, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',.22)');
    grd.addColorStop(1, 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return c;
  }

  var COLORS = [
    [255, 92, 158],
    [255, 150, 196],
    [255, 48, 124],
    [196, 116, 255],
    [255, 214, 234]
  ];
  var SPRITES = COLORS.map(function (c) { return makeSprite(c); });
  var STAR = makeSprite([255, 246, 250], 48);

  function radialSprite(stops, size) {
    var S = size || 256;
    var c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d'), r = S / 2;
    var grd = g.createRadialGradient(r, r, 0, r, r, r);
    for (var i = 0; i < stops.length; i++) grd.addColorStop(stops[i][0], stops[i][1]);
    g.fillStyle = grd;
    g.fillRect(0, 0, S, S);
    return c;
  }

  var GLOW = radialSprite([
    [0, 'rgba(255,95,155,.55)'],
    [0.28, 'rgba(255,60,130,.22)'],
    [0.62, 'rgba(180,50,160,.07)'],
    [1, 'rgba(120,20,120,0)']
  ]);

  var RING = radialSprite([
    [0, 'rgba(255,120,175,0)'],
    [0.52, 'rgba(255,160,200,.35)'],
    [0.72, 'rgba(255,120,175,.85)'],
    [0.88, 'rgba(255,90,155,.22)'],
    [1, 'rgba(255,90,155,0)']
  ]);

  // 小爱心精灵
  var HEART_SPRITE = (function () {
    var S = 160, c = document.createElement('canvas');
    c.width = c.height = S;
    var g = c.getContext('2d');
    g.translate(S / 2, S / 2);
    var sc = S * 0.80 / 32;
    g.beginPath();
    for (var i = 0; i <= 48; i++) {
      var t = i / 48 * TAU;
      var hx = 16 * Math.pow(Math.sin(t), 3);
      var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      var px = hx * sc, py = -hy * sc;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    var grd = g.createLinearGradient(0, -S * 0.34, 0, S * 0.34);
    grd.addColorStop(0, '#ffe0ec');
    grd.addColorStop(0.42, '#ff6aa6');
    grd.addColorStop(1, '#e02a70');
    g.shadowColor = 'rgba(255,90,150,.9)';
    g.shadowBlur = S * 0.18;
    g.fillStyle = grd;
    g.fill();
    g.fill();
    return c;
  })();

  /* ================= 心形几何 ================= */
  var GEOM = (function () {
    var N = 1600, raw = [], cum = [0], len = 0;
    for (var i = 0; i <= N; i++) {
      var t = i / N * TAU;
      var x = 16 * Math.pow(Math.sin(t), 3);
      var y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) + 2.5;
      raw.push([x, y]);
      if (i > 0) {
        len += Math.hypot(x - raw[i - 1][0], y - raw[i - 1][1]);
        cum.push(len);
      }
    }
    return { raw: raw, cum: cum, len: len };
  })();

  function sampleHeart(d) {
    var raw = GEOM.raw, cum = GEOM.cum, lo = 1, hi = cum.length - 1;
    while (lo < hi) {
      var mid = (lo + hi) >> 1;
      if (cum[mid] < d) lo = mid + 1; else hi = mid;
    }
    var seg = (cum[lo] - cum[lo - 1]) || 1;
    var f = (d - cum[lo - 1]) / seg;
    var a = raw[lo - 1], b = raw[lo];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
  }

  function normalAt(d) {
    var e = 0.7;
    var p1 = sampleHeart((d - e + GEOM.len) % GEOM.len);
    var p2 = sampleHeart((d + e) % GEOM.len);
    var nx = -(p2[1] - p1[1]), ny = (p2[0] - p1[0]);
    var L = Math.hypot(nx, ny) || 1;
    nx /= L; ny /= L;
    var p = sampleHeart(d);
    if (nx * p[0] + ny * p[1] < 0) { nx = -nx; ny = -ny; }
    return [nx, ny];
  }

  /* ================= 状态 ================= */
  var W = 0, H = 0, DPR = 1, pscale = 1;
  var heart = { cx: 0, cy: 0, size: 240 };
  var particles = [], motes = [], sparks = [], waves = [], minis = [], shots = [];
  var time = 0, formT = 0, impulse = 0, charge = 0, last = 0, running = false, rafId = 0;
  var beatPhase = 0;
  var offX = 0, offY = 0;
  var chargeHintOn = false;
  var shotTimer = rand(2.5, 5);

  var ptr = { down: false, x: 0, y: 0, sx: 0, sy: 0, t0: 0, moved: 0, strength: 0 };

  function viewportH() {
    return (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  }

  /* ================= 布局 ================= */
  function layout() {
    W = Math.max(1, Math.round(window.innerWidth));
    H = Math.max(1, Math.round(viewportH()));
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';

    var portrait = H >= W * 0.86;
    document.body.classList.toggle('wide', !portrait);

    if (portrait) {
      heart.cx = W / 2;
      heart.cy = H * 0.318;
      heart.size = Math.min(W * 0.86, H * 0.345);
    } else {
      heart.cx = W * 0.30;
      heart.cy = H * 0.5;
      heart.size = Math.min(W * 0.33, H * 0.62);
    }
    pscale = clamp(heart.size / 268, 0.82, 1.75);

    var ax = (heart.cx / W * 100).toFixed(2) + '%';
    var ay = (heart.cy / H * 100).toFixed(2) + '%';
    document.documentElement.style.setProperty('--ax', ax);
    document.documentElement.style.setProperty('--ay', ay);
    auroraEl.style.transformOrigin = ax + ' ' + ay;
  }

  /* ================= 粒子 ================= */
  function buildParticles() {
    var n = Math.max(660, Math.min(1150, Math.round(W * H / 1000)));
    if (reduceMotion) n = Math.round(n * 0.6);
    particles = new Array(n);
    for (var i = 0; i < n; i++) {
      var d = Math.random() * GEOM.len;
      var p = sampleHeart(d);
      var nr = normalAt(d);
      var r3 = Math.random();
      var spread = r3 < 0.52 ? 0.55 : (r3 < 0.86 ? 1.6 : 4.2);
      var off = gauss() * spread;
      var ux = (p[0] + nr[0] * off) / 29;
      var uy = (p[1] + nr[1] * off) / 29;
      var ang = Math.random() * TAU;
      var tight = r3 < 0.52;
      particles[i] = {
        ux: ux,
        uy: uy,
        rn: Math.min(1, Math.hypot(ux, uy) / 0.75),
        sx0: rand(-0.62, 0.62),
        sy0: rand(-0.62, 0.62),
        depth: rand(0.93, 1.04),
        sp: SPRITES[(Math.random() * SPRITES.length) | 0],
        size: tight ? rand(4, 7.5) : (r3 < 0.86 ? rand(5, 9.5) : rand(6, 12)),
        alpha: tight ? rand(0.72, 1) : rand(0.35, 0.8),
        ph: Math.random() * TAU,
        freq: rand(1.1, 3.0),
        delay: Math.random() * 0.28,
        px: 0, py: 0, hasPrev: false
      };
    }
  }

  function buildMotes() {
    var n = Math.round(clamp(W * H / 16000, 22, 68));
    motes = new Array(n);
    for (var i = 0; i < n; i++) {
      motes[i] = {
        x: Math.random() * W,
        y: Math.random() * H,
        vx: rand(-5, 5),
        vy: rand(-16, -4),
        s: rand(1.6, 4.2),
        a: rand(0.07, 0.26),
        ph: Math.random() * TAU
      };
    }
  }

  /* ================= 心跳：ECG 波形 + 心率变异 + 传导 ================= */
  function bump(p, c, w) {
    var d = (p - c) / w;
    return Math.exp(-d * d);
  }
  function ecgAt(p) {
    p = p - Math.floor(p);
    return bump(p, 0.17, 0.050) + 0.42 * bump(p, 0.41, 0.090) + 0.10 * bump(p, 0.02, 0.040);
  }

  function advanceBeat(dt) {
    // 静息 ~58 次/分；按住时加速到 ~92；叠加自然心率变异
    var bpm = 58 + 34 * charge
      + 2.2 * Math.sin(time * 0.23)
      + 1.3 * Math.sin(time * 0.61 + 1.7);
    beatPhase += dt * bpm / 60;
    beatPhase -= Math.floor(beatPhase);
  }

  /* ================= 特效 ================= */
  function burst(x, y, n, speed) {
    speed = speed || 1;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;
      var dd = rand(0, 0.32) * heart.size;
      sparks.push({
        x: x + Math.cos(a) * dd,
        y: y + Math.sin(a) * dd,
        vx: Math.cos(a) * rand(120, 760) * speed,
        vy: Math.sin(a) * rand(120, 760) * speed,
        life: 0,
        max: rand(0.5, 1.2),
        size: rand(5, 14),
        sp: Math.random() < 0.32 ? STAR : SPRITES[(Math.random() * SPRITES.length) | 0]
      });
    }
  }

  function spawnMinis(x, y, n, mode) {
    for (var i = 0; i < n; i++) {
      if (mode === 'rain') {
        minis.push({
          x: Math.random() * W,
          y: rand(-H * 0.35, -20),
          vx: rand(-18, 18),
          vy: rand(30, 80),
          g: rand(90, 190),
          s: rand(12, 30),
          rot: rand(-0.5, 0.5),
          rotv: rand(-1.6, 1.6),
          life: 0,
          max: rand(3.4, 5.2),
          ph: Math.random() * TAU
        });
      } else {
        minis.push({
          x: x + rand(-46, 46),
          y: y + rand(-34, 34),
          vx: rand(-30, 30),
          vy: rand(-110, -50),
          g: 34,
          s: rand(12, 26),
          rot: rand(-0.4, 0.4),
          rotv: rand(-0.8, 0.8),
          life: 0,
          max: rand(1.6, 2.8),
          ph: Math.random() * TAU
        });
      }
    }
  }

  function shockwave(r0, r1, dur) {
    waves.push({ x: heart.cx + offX, y: heart.cy + offY, r: r0, maxR: r1, life: 0, dur: dur });
  }

  function flash(strength) {
    flashEl.style.transition = 'none';
    flashEl.style.opacity = String(strength);
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        flashEl.style.transition = 'opacity 1s cubic-bezier(.2,.8,.3,1)';
        flashEl.style.opacity = '0';
      });
    });
  }

  /* ================= 绘制 ================= */
  function drawMotes(dt) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.y < -20) { m.y = H + 20; m.x = Math.random() * W; }
      if (m.x < -20) m.x = W + 20;
      if (m.x > W + 20) m.x = -20;
      var tw = 0.65 + 0.35 * Math.sin(time * 1.6 + m.ph);
      ctx.globalAlpha = m.a * tw;
      var s = m.s * 4;
      ctx.drawImage(STAR, m.x - s / 2, m.y - s / 2, s, s);
    }
  }

  function drawShots(dt) {
    for (var i = shots.length - 1; i >= 0; i--) {
      var o = shots[i];
      o.life += dt;
      if (o.life >= o.dur) { shots.splice(i, 1); continue; }
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      var t = o.life / o.dur;
      var a = Math.sin(Math.PI * t);
      var tx2 = o.x - o.vx * 0.09, ty2 = o.y - o.vy * 0.09;
      var grd = ctx.createLinearGradient(o.x, o.y, tx2, ty2);
      grd.addColorStop(0, 'rgba(255,238,246,' + (0.85 * a).toFixed(3) + ')');
      grd.addColorStop(1, 'rgba(255,150,200,0)');
      ctx.globalAlpha = 1;
      ctx.strokeStyle = grd;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(o.x, o.y);
      ctx.lineTo(tx2, ty2);
      ctx.stroke();
    }
  }

  function drawExtras(dt) {
    var i, o;

    for (i = sparks.length - 1; i >= 0; i--) {
      o = sparks[i];
      o.life += dt;
      if (o.life >= o.max) { sparks.splice(i, 1); continue; }
      var drag = Math.pow(0.12, dt);
      o.vx *= drag;
      o.vy = o.vy * drag - 26 * dt;
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      var k = 1 - o.life / o.max;
      ctx.globalAlpha = clamp(k, 0, 1) * 0.9;
      var s = o.size * (0.5 + k * 0.8);
      ctx.drawImage(o.sp, o.x - s / 2, o.y - s / 2, s, s);
    }

    for (i = waves.length - 1; i >= 0; i--) {
      o = waves[i];
      o.life += dt;
      var t = o.life / o.dur;
      if (t >= 1) { waves.splice(i, 1); continue; }
      var e = easeOutCubic(t);
      var r = o.r + (o.maxR - o.r) * e;
      var D = r * 2 / 0.72;
      ctx.globalAlpha = clamp((1 - t) * 0.85, 0, 1);
      ctx.drawImage(RING, o.x - D / 2, o.y - D / 2, D, D);
    }

    for (i = minis.length - 1; i >= 0; i--) {
      o = minis[i];
      o.life += dt;
      if (o.life >= o.max) { minis.splice(i, 1); continue; }
      o.vy += o.g * dt;
      o.x += o.vx * dt + Math.sin(time * 2.2 + o.ph) * 16 * dt;
      o.y += o.vy * dt;
      o.rot += o.rotv * dt;
      var life = o.life / o.max;
      ctx.globalAlpha = clamp(Math.sin(Math.PI * Math.min(life * 1.08, 1)) * 0.9, 0, 1);
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot + Math.sin(time * 1.4 + o.ph) * 0.12);
      ctx.drawImage(HEART_SPRITE, -o.s / 2, -o.s / 2, o.s, o.s);
      ctx.restore();
    }
  }

  function render(dt) {
    var pulse = ecgAt(beatPhase);
    var glowA = 0.075 + 0.14 * pulse + impulse * 0.38 + charge * 0.22;
    var k0 = heart.size * (1 + charge * 0.045);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    // 外发光
    var gs = heart.size * 3.4 * (1 + impulse * 0.25 + charge * 0.12);
    ctx.globalAlpha = clamp(glowA, 0, 1);
    ctx.drawImage(GLOW, heart.cx + offX - gs / 2, heart.cy + offY - gs / 2, gs, gs);

    if (!reduceMotion) { drawMotes(dt); drawShots(dt); }

    var forming = formT < 2.4;
    var i, p, e, x, y, a, sz, tw, b, sc;

    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      e = easeOutQuint(clamp((formT - 0.12 - p.delay) / 1.15, 0, 1));

      // 传导：越靠外，心跳到得越晚
      b = ecgAt(beatPhase - p.rn * 0.045);
      sc = 1 + 0.078 * b + impulse * 0.55 + charge * 0.04;

      var k = k0 * sc * p.depth;
      var tx = heart.cx + offX + p.ux * k + Math.sin(time * 0.85 + p.ph) * 1.3;
      var ty = heart.cy + offY - p.uy * k + Math.cos(time * 1.03 + p.ph * 1.7) * 1.3;

      // 手指揉一揉
      if (ptr.strength > 0.01) {
        var dx = tx - ptr.x, dy = ty - ptr.y;
        var d2 = dx * dx + dy * dy;
        var R = heart.size * 0.70;
        if (d2 < R * R) {
          var dd = Math.sqrt(d2) || 1;
          var f = 1 - dd / R;
          f = f * f * ptr.strength * heart.size * 0.21;
          tx += dx / dd * f;
          ty += dy / dd * f;
        }
      }

      if (e < 1) {
        // 从四周旋着汇入
        var ang = (1 - e) * 1.25;
        var ox = p.sx0 * W, oy = p.sy0 * H;
        var ca = Math.cos(ang), sa = Math.sin(ang);
        var rx = ox * ca - oy * sa;
        var ry = ox * sa + oy * ca;
        var sx = heart.cx + offX + rx;
        var sy = heart.cy + offY + ry;
        x = sx + (tx - sx) * e;
        y = sy + (ty - sy) * e;
      } else {
        x = tx; y = ty;
      }

      tw = 0.72 + 0.28 * Math.sin(time * p.freq + p.ph);
      a = p.alpha * tw * (0.18 + 0.82 * e) * (0.70 + 0.5 * b + impulse * 0.45 + charge * 0.2);
      sz = p.size * pscale * (1 + b * 0.24 + impulse * 0.28) * (0.5 + 0.5 * e);

      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.drawImage(p.sp, x - sz / 2, y - sz / 2, sz, sz);

      // 汇聚时的拖尾
      if (forming && e > 0.02 && e < 0.98) {
        if (p.hasPrev) {
          ctx.globalAlpha = clamp(a * 0.32, 0, 1);
          var sz2 = sz * 0.85;
          ctx.drawImage(p.sp, p.px - sz2 / 2, p.py - sz2 / 2, sz2, sz2);
        }
        p.px = x; p.py = y; p.hasPrev = true;
      } else if (p.hasPrev) {
        p.hasPrev = false;
      }
    }

    // 蓄力进度环
    if (charge > 0.02) {
      ctx.globalAlpha = clamp(charge * 0.5, 0, 0.65);
      ctx.strokeStyle = 'rgba(255,172,208,1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(heart.cx + offX, heart.cy + offY, heart.size * 0.66,
        -Math.PI / 2, -Math.PI / 2 + TAU * clamp(charge, 0, 1));
      ctx.stroke();
    }

    drawExtras(dt);

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ================= 主循环 ================= */
  function frame(now) {
    if (!running) return;
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    time += dt;
    if (formT < 2.4) formT += dt;
    impulse *= Math.exp(-dt * 2.1);

    // 按住蓄力（只有按住不太动才算）
    if (ptr.down) {
      var held = time - ptr.t0;
      var target = (held > 0.22 && ptr.moved < 22) ? clamp((held - 0.22) / 1.1, 0, 1) : 0;
      charge += (target - charge) * Math.min(1, dt * 6);
      ptr.strength += (1 - ptr.strength) * Math.min(1, dt * 10);
    } else {
      charge += (0 - charge) * Math.min(1, dt * 5);
      ptr.strength += (0 - ptr.strength) * Math.min(1, dt * 7);
    }

    // 蓄力提示
    var chargeOn = ptr.down && charge > 0.14;
    if (chargeOn !== chargeHintOn) {
      chargeHintOn = chargeOn;
      if (chargeOn) setHint('继续按住 · 松手送出去', true);
    }

    // 拖动时心跟着手走一点
    var tfx = 0, tfy = 0;
    if (ptr.down) {
      tfx = clamp((ptr.x - ptr.sx) * 0.05, -26, 26);
      tfy = clamp((ptr.y - ptr.sy) * 0.05, -26, 26);
    }
    offX += (tfx - offX) * Math.min(1, dt * 7);
    offY += (tfy - offY) * Math.min(1, dt * 7);

    advanceBeat(dt);

    var pulse = ecgAt(beatPhase);
    auroraEl.style.transform = 'scale(' + (1 + pulse * 0.05 + impulse * 0.05 + charge * 0.04).toFixed(4) + ')';

    // 偶发流星
    shotTimer -= dt;
    if (shotTimer <= 0) {
      shotTimer = rand(7, 16);
      shots.push({
        x: rand(0.05, 1.0) * W,
        y: rand(-0.05, 0.4) * H,
        vx: -rand(190, 330),
        vy: rand(70, 150),
        life: 0,
        dur: rand(0.9, 1.6)
      });
    }

    render(dt);
    rafId = requestAnimationFrame(frame);
  }

  /* ================= 文案 ================= */
  var POEMS = [
    '有些心意，不必说出口，心跳会替我说。',
    '愿你的每一次心跳，都刚好有人回应。',
    '允公允能，日新月异。南开人，慢慢来，也很好。',
    '八里台的风，津南的月，都记得你努力的样子。',
    '新开湖的晚霞，我存了很久，想分你一半。',
    '大中路很长，但你不必一个人走完。',
    '论文会写完的，实验会成的，你也会好起来的。',
    '今天也要好好吃饭，好好睡觉，好好被爱。',
    '别怕，世界再大，也总有人把你放在心上。',
    '你不需要成为谁的骄傲，你已经在发光了。',
    '无论走多远，南开都为你留着一盏灯。',
    '愿你被这世界温柔以待，也愿你温柔待自己。',
    '如果累了，就在这儿，听一会儿心跳吧。',
    '记得抬头看看月亮，它也在替我们守着这片夜。'
  ];
  var GIFT = '这一下心跳，是专门为你跳的。';
  var poemIdx = 0;
  var poemBusy = false;

  function showPoem(text) {
    if (poemBusy) return;
    poemBusy = true;
    var el = poemText;
    el.style.opacity = '0';
    el.style.filter = 'blur(7px)';
    el.style.transform = 'translateY(7px)';
    window.setTimeout(function () {
      el.textContent = text;
      el.style.opacity = '1';
      el.style.filter = 'blur(0)';
      el.style.transform = 'translateY(0)';
      poemBusy = false;
    }, 340);
  }

  function nextPoem() {
    poemIdx = (poemIdx + 1) % POEMS.length;
    showPoem(POEMS[poemIdx]);
    setHint('第 ' + (poemIdx + 1) + '/' + POEMS.length + ' 句 · 按住还能加速', false);
  }

  /* ================= 提示 ================= */
  var hintTimer = 0;
  function setHint(text, hot) {
    hintEl.textContent = text;
    if (hot) hintEl.classList.add('hot'); else hintEl.classList.remove('hot');
  }

  var HINT_IDLE = '轻触换一句 · 按住加速 · 拖动揉一揉';
  function resetHintLater(ms) {
    window.clearTimeout(hintTimer);
    hintTimer = window.setTimeout(function () { setHint(HINT_IDLE, false); }, ms);
  }

  /* ================= 交互 ================= */
  function onDown(x, y) {
    ptr.down = true;
    ptr.x = x; ptr.y = y;
    ptr.sx = x; ptr.sy = y;
    ptr.t0 = time;
    ptr.moved = 0;
  }

  function onMove(x, y) {
    if (!ptr.down) return;
    ptr.moved += Math.hypot(x - ptr.x, y - ptr.y);
    ptr.x = x; ptr.y = y;

    if (ptr.moved > 26 && Math.random() < 0.35) {
      sparks.push({
        x: x + rand(-6, 6),
        y: y + rand(-6, 6),
        vx: rand(-40, 40),
        vy: rand(-60, 10),
        life: 0,
        max: rand(0.35, 0.8),
        size: rand(3, 7),
        sp: SPRITES[(Math.random() * SPRITES.length) | 0]
      });
    }
  }

  function onUp() {
    if (!ptr.down) return;
    var held = time - ptr.t0;
    var moved = ptr.moved;
    var c = charge;
    ptr.down = false;

    if (moved > 26) {
      // 拖动：只是揉一揉
      return;
    }
    if (held > 0.3 && c > 0.35) {
      releaseBurst(c);
      return;
    }

    // 轻触
    impulse = Math.max(impulse, 0.85);
    burst(heart.cx + offX, heart.cy + offY, reduceMotion ? 24 : 58);
    shockwave(heart.size * 0.18, heart.size * 0.8, 0.75);
    flash(0.45);
    try { if (navigator.vibrate) navigator.vibrate([12, 44, 16]); } catch (e) {}
    nextPoem();
  }

  function releaseBurst(c) {
    impulse = 1.15;
    burst(heart.cx + offX, heart.cy + offY, reduceMotion ? 40 : 130, 1.35);
    shockwave(heart.size * 0.1, heart.size * 1.15, 0.95);
    shockwave(heart.size * 0.35, heart.size * 0.7, 0.6);
    spawnMinis(0, 0, reduceMotion ? 10 : 26, 'rain');
    flash(0.62);
    showPoem(GIFT);
    setHint('刚刚那一下，是送给你的。', true);
    resetHintLater(4200);
    try { if (navigator.vibrate) navigator.vibrate([18, 60, 26, 40, 18]); } catch (e) {}
  }

  window.addEventListener('pointerdown', function (ev) {
    if (ev.pointerType === 'mouse' && ev.button !== 0) return;
    onDown(ev.clientX, ev.clientY);
  }, { passive: true });

  window.addEventListener('pointermove', function (ev) {
    onMove(ev.clientX, ev.clientY);
  }, { passive: true });

  window.addEventListener('pointerup', onUp, { passive: true });
  window.addEventListener('pointercancel', function () { ptr.down = false; }, { passive: true });

  window.addEventListener('keydown', function (ev) {
    if (ev.key === ' ' || ev.key === 'Enter') {
      ev.preventDefault();
      onDown(heart.cx, heart.cy);
      window.setTimeout(onUp, 80);
    }
  });

  /* ================= 入场 ================= */
  function reveal(el, at) {
    window.setTimeout(function () { if (el) el.classList.add('in'); }, at);
  }

  function sequence() {
    var els = document.querySelectorAll('.reveal');
    var delays = [900, 1120, 1560, 1900, 2500, 2860];
    for (var i = 0; i < els.length && i < delays.length; i++) reveal(els[i], delays[i]);

    // 开场：一点光炸开 → 亿点光汇成心 → 第一下心跳
    window.setTimeout(function () { flash(0.3); }, 90);
    window.setTimeout(birth, 1560);
  }

  function birth() {
    impulse = 0.9;
    shockwave(heart.size * 1.35, heart.size * 0.34, 0.85); // 收束的光环
    burst(heart.cx, heart.cy, reduceMotion ? 20 : 54);
  }

  /* ================= 尺寸变化 ================= */
  var reflowTimer = 0;
  function reflow() {
    layout();
    buildParticles();
    buildMotes();
  }
  function onResize() {
    window.clearTimeout(reflowTimer);
    reflowTimer = window.setTimeout(reflow, 180);
  }

  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', onResize, { passive: true });

  function startLoop() {
    if (rafId) cancelAnimationFrame(rafId);
    running = true;
    last = 0;
    rafId = requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      running = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    } else {
      startLoop();
    }
  });

  /* ================= 启动 ================= */
  layout();
  buildParticles();
  buildMotes();
  sequence();
  startLoop();
})();
</script>
</body>
</html>
